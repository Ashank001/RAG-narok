services:
  # ── RAG API (FastAPI only) ──────────────────────────────
  - type: web
    name: ragnarok-rag-api
    runtime: docker
    plan: free
    dockerfilePath: rag-engine/Dockerfile.api
    dockerContext: rag-engine
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_TOKEN 
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://ashank01.xyz,https://rag-narok-bnbocq2vs-ashank1301-3045s-projects.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003"
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp
      - key: TRANSFORMERS_CACHE
        value: /tmp
      - key: PYTHONUNBUFFERED
        value: "1"




  # ── API Gateway (Node.js Express) ──────────────────────
  - type: web
    name: ragnarok-api-gateway
    runtime: node
    plan: free
    rootDir: api-gateway
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: "3001"
      - key: RAG_ENGINE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
